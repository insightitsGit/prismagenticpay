services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PAP_ENV: production
      PAP_API_KEYS: ${PAP_API_KEYS:-changeme-set-real-keys}
      PAP_DATABASE_URL: sqlite:////data/prismagenticpay.sqlite
    volumes:
      - ledger:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ledger:

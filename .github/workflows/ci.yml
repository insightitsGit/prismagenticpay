name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install "$(find dist -name '*.whl')[dev]"
      - run: python -m pip check
      - name: Test installed wheel outside checkout
        run: |
          cp -R tests "$RUNNER_TEMP/pap-tests"
          cd "$RUNNER_TEMP"
          python -m pytest pap-tests -q
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/

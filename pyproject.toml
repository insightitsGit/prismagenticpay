[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismagenticpay"
version = "1.4.0"
description = "Deterministic policy-authority kernel for autonomous agent payments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amin Parva" }]
dependencies = [
    "pydantic>=2.6",
    "prismthinker>=1.1.0",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["prismagenticpay*"]

[tool.setuptools.package-data]
prismagenticpay = ["console/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
